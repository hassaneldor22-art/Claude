services:
  - type: web
    name: mask-game        # الاسم القديم محفوظ حتى يضل نفس الرابط
    runtime: node
    plan: free
    rootDir: game/bomb-game
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz

  - type: web
    name: teachers-room
    runtime: node
    plan: free
    rootDir: teachers
    buildCommand: echo ok
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
