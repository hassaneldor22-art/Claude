<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مين ورا القناع؟</title>
<style>
:root{--bg:#12121a;--card:#1c1c28;--card2:#242435;--text:#f1f1f6;--muted:#9a9ab0;--accent:#8b7bff;--accent2:#5de0b8;--danger:#ff6b81;--warn:#ffc857;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:8px 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 20px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #34344a;background:var(--card2);color:var(--text);font-size:16px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
button{font-family:inherit;font-size:16px;font-weight:600;border:0;border-radius:12px;padding:14px 16px;background:var(--accent);color:#fff;cursor:pointer;width:100%}
button.alt{background:var(--card2);color:var(--text)}
button:disabled{opacity:.45;cursor:not-allowed}
button:active:not(:disabled){transform:scale(.98)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.gap{height:10px}
.code{font-size:44px;letter-spacing:10px;text-align:center;font-weight:800;direction:ltr;color:var(--accent2)}
.hint{color:var(--muted);font-size:14px;text-align:center}
.pl{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--card2);border-radius:10px;margin-bottom:6px}
.pl.off{opacity:.45}
.badge{font-size:12px;background:var(--accent);padding:2px 8px;border-radius:99px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:14px}
.timer{font-size:26px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.timer.low{color:var(--danger)}
.focus{text-align:center;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,#3b2f8f,#5a3fa8);margin-bottom:10px}
.focus b{font-size:26px;direction:ltr;display:inline-block}
.target{background:linear-gradient(135deg,#8f2f4b,#a8483f)}
.card-pub{background:#1f2f3f;border:1px solid #2f4a63;border-radius:var(--r);padding:10px 12px;margin-bottom:10px;font-size:15px}
.card-pub small{color:var(--accent2);display:block;margin-bottom:2px}
.card-sec{background:#3a2a1a;border:1px dashed var(--warn);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;font-size:15px}
.card-sec small{color:var(--warn);display:block;margin-bottom:2px}
.chat{flex:1;min-height:150px;max-height:36vh;overflow-y:auto;background:var(--card);border-radius:var(--r);padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.msg{background:var(--card2);padding:8px 10px;border-radius:10px;max-width:88%;word-break:break-word}
.msg.me{background:#3a3470;align-self:flex-end}
.msg .who{font-size:12px;color:var(--accent2);direction:ltr;display:block;text-align:right}
.chatbar{display:flex;gap:8px;margin-bottom:10px}
.chatbar input{flex:1}
.chatbar button{width:auto;padding:0 18px}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.votes button{background:var(--card2);color:var(--text)}
.votes button.mine{background:var(--accent2);color:#05281f}
.big{font-size:22px;text-align:center;font-weight:800;margin:6px 0}
.ok{color:var(--accent2)}.bad{color:var(--danger)}.warn{color:var(--warn)}
.rank{display:flex;justify-content:space-between;padding:12px;background:var(--card2);border-radius:10px;margin-bottom:6px;font-size:18px}
.rank.first{background:#4b3f10;color:var(--warn);font-weight:800}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#000c;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
.status{position:fixed;top:0;left:0;right:0;background:var(--danger);text-align:center;font-size:13px;padding:4px;display:none}
.status.show{display:block}
</style>
</head>
<body>
<div class="status" id="status">انقطع الاتصال… عم نحاول نرجع</div>
<div id="app"></div>
<div id="toast"></div>
<script>
(function () {
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const statusEl = document.getElementById('status');
  let ws = null, state = null, retry = 0, tick = null, offset = 0;
  const KEY = 'maskgame';
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
    clear() { try { localStorage.removeItem(KEY); } catch (e) {} }
  };

  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) for (const k in props) {
      if (props[k] == null || props[k] === false) continue;
      if (k === 'class') e.className = props[k];
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
      else if (k === 'disabled') e.disabled = !!props[k];
      else e.setAttribute(k, props[k]);
    }
    for (const kid of kids) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(kid));
    return e;
  }
  function toast(t) {
    toastEl.textContent = t; toastEl.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host);
    ws.onopen = () => {
      retry = 0; statusEl.classList.remove('show');
      const s = store.get();
      if (s.code && s.token) send({ type: 'resume', code: s.code, token: s.token });
      else if (!state) renderHome();
    };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === 'joined') store.set({ code: m.code, token: m.token });
      else if (m.type === 'gone') { store.clear(); state = null; renderHome(); }
      else if (m.type === 'error') toast(m.text);
      else if (m.type === 'notice') toast(m.text);
      else if (m.type === 'state') { state = m; offset = m.now - Date.now(); render(); }
    };
    ws.onclose = () => {
      statusEl.classList.add('show');
      setTimeout(connect, Math.min(5000, 500 * ++retry));
    };
  }

  function leave() { store.clear(); state = null; try { ws.close(); } catch (e) {} renderHome(); }

  // ---------- الشاشات ----------
  function renderHome() {
    clearInterval(tick);
    const name = el('input', { placeholder: 'اسمك الحقيقي (للأصحاب)', maxlength: 16, autocomplete: 'off' });
    const code = el('input', { placeholder: 'رمز الغرفة', maxlength: 4, autocapitalize: 'characters', autocomplete: 'off', style: 'text-transform:uppercase;direction:ltr;text-align:center;letter-spacing:6px' });
    const prev = store.get(); if (prev.name) name.value = prev.name;
    const remember = () => { const s = store.get(); s.name = name.value; store.set(s); };
    app.replaceChildren(
      el('h1', null, '🎭 مين ورا القناع؟'),
      el('p', { class: 'sub' }, 'خمّن مين ورا الاسم المستعار'),
      el('div', { class: 'card' },
        name, el('div', { class: 'gap' }),
        el('button', { onclick: () => { if (!name.value.trim()) return toast('اكتب اسمك'); remember(); send({ type: 'create', name: name.value }); } }, 'افتح غرفة جديدة')),
      el('div', { class: 'card' },
        code, el('div', { class: 'gap' }),
        el('button', { class: 'alt', onclick: () => { if (!name.value.trim()) return toast('اكتب اسمك'); if (code.value.trim().length < 4) return toast('اكتب رمز الغرفة'); remember(); send({ type: 'join', code: code.value, name: name.value }); } }, 'ادخل غرفة'))
    );
  }

  function render() {
    if (!state) return;
    clearInterval(tick);
    ({ lobby: renderLobby, round: renderRound, result: renderResult, ended: renderEnded }[state.phase] || renderLobby)();
  }

  function playerList() {
    return state.players.map((p) => el('div', { class: 'pl' + (p.connected ? '' : ' off') },
      el('span', null, p.name + (p.id === state.you.id ? ' (أنت)' : '')),
      p.id === state.hostId ? el('span', { class: 'badge' }, 'المضيف') : null));
  }

  function renderLobby() {
    const isHost = state.you.id === state.hostId;
    const n = state.players.filter((p) => p.connected).length;
    const sel = el('select', null, ...state.winOptions.map((v) => el('option', { value: v, selected: v === 10 ? 'selected' : null }, v + ' نقاط للفوز')));
    sel.value = '10';
    app.replaceChildren(
      el('div', { class: 'card' }, el('div', { class: 'hint' }, 'رمز الغرفة — ابعته للأصحاب'), el('div', { class: 'code' }, state.code),
        el('div', { class: 'gap' }),
        el('button', { class: 'alt', onclick: () => shareLink() }, '📋 انسخ رابط الدعوة')),
      el('div', { class: 'card' }, el('div', { class: 'hint' }, `اللاعبين (${n} من ${state.max})`), el('div', { class: 'gap' }), ...playerList()),
      isHost
        ? el('div', { class: 'card' }, sel, el('div', { class: 'gap' }),
            el('button', { disabled: n < state.min, onclick: () => send({ type: 'start', winScore: Number(sel.value) }) }, n < state.min ? `لازم ${state.min} لاعبين على الأقل` : 'ابدأ اللعبة'))
        : el('p', { class: 'hint' }, 'بانتظار المضيف يبدأ اللعبة…'),
      el('button', { class: 'alt', onclick: leave }, 'اطلع من الغرفة')
    );
  }

  function shareLink() {
    const url = location.origin + '/?room=' + state.code;
    if (navigator.share) navigator.share({ title: 'مين ورا القناع؟', text: 'تعال العب! رمز الغرفة: ' + state.code, url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('تم نسخ الرابط ✓'), () => toast(url));
    else toast(url);
  }

  function secsLeft() { return Math.max(0, Math.ceil((state.endsAt - (Date.now() + offset)) / 1000)); }

  function renderRound() {
    const you = state.you;
    const timer = el('span', { class: 'timer' });
    const chat = el('div', { class: 'chat' });
    for (const m of state.chat) {
      chat.append(el('div', { class: 'msg' + (m.fake === you.fake ? ' me' : '') }, el('span', { class: 'who' }, m.fake), m.text));
    }
    const input = el('input', { placeholder: 'اكتب هون…', maxlength: 200, autocomplete: 'off', enterkeyhint: 'send' });
    const sendChat = () => { const t = input.value.trim(); if (t) { send({ type: 'chat', text: t }); input.value = ''; } input.focus(); };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

    const others = state.players.filter((p) => p.id !== you.id);
    let votePanel;
    if (you.voted) {
      votePanel = el('div', { class: 'card' }, el('div', { class: 'big ok' }, 'صوّتت ✓'),
        el('div', { class: 'hint' }, `صوّت ${state.votedCount} من ${state.requiredCount}`));
    } else {
      votePanel = el('div', { class: 'card' },
        el('div', { class: 'hint' }, `مين ورا ${state.targetFake}؟ (التصويت نهائي)`), el('div', { class: 'gap' }),
        el('div', { class: 'votes' }, ...others.map((p) => el('button', { onclick: () => { if (confirm(`${state.targetFake} هو ${p.name}؟`)) send({ type: 'vote', guessId: p.id }); } }, p.name))));
    }
    const reveal = you.canReveal ? el('button', { onclick: () => send({ type: 'reveal' }) }, 'اعرض النتيجة') : null;

    const parts = [
      el('div', { class: 'top' }, el('span', null, 'الجولة ' + state.round), timer, el('span', null, `صوّت ${state.votedCount}/${state.requiredCount}`)),
      you.isTarget
        ? el('div', { class: 'focus target' }, el('div', null, 'أنت الهدف! 🎯'), el('div', null, 'اسمك: ', el('b', null, you.fake)), el('div', { class: 'hint' }, 'اخلط الكل وحاول ما ينكشف مين إنت'))
        : el('div', { class: 'focus' }, el('div', null, 'ركّزوا على'), el('b', null, state.targetFake), el('div', { class: 'hint' }, 'اسألوه واحكوا معه، ما تسألوه اسمه')),
      state.card ? el('div', { class: 'card-pub' }, el('small', null, state.card.type === 'ask' ? '❓ سؤال للهدف' : '💬 موضوع الجولة'), state.card.text) : null,
      you.secretCard ? el('div', { class: 'card-sec' }, el('small', null, '🤫 بطاقتك السرية (بس إنت بتشوفها)'), you.secretCard) : null,
      chat,
      el('div', { class: 'chatbar' }, input, el('button', { onclick: sendChat }, 'إرسال')),
      votePanel, reveal
    ];
    app.replaceChildren(...parts.filter(Boolean));
    chat.scrollTop = chat.scrollHeight;
    const upd = () => { const s = secsLeft(); timer.textContent = s; timer.classList.toggle('low', s <= 10); };
    upd(); tick = setInterval(upd, 500);
  }

  function renderResult() {
    const r = state.result || {};
    const cd = el('span', null, '');
    let body;
    if (r.skipped) {
      body = [el('div', { class: 'big warn' }, '⏭ الجولة انسكبت'), el('p', { class: 'hint' }, 'ما صوّت الكل خلال الدقيقة. ما انكشف حدا.')];
    } else {
      body = [
        el('div', { class: 'hint' }, 'الهدف كان'),
        el('div', { class: 'big' }, r.targetName),
        el('div', { class: 'hint', style: 'direction:ltr' }, r.targetFake),
        el('div', { class: 'big ' + (r.exposed ? 'ok' : 'bad') }, r.exposed ? 'انكشف! 🎯' : 'نجا! 🥷'),
        el('p', { class: 'hint' }, `${r.correct} من ${r.total} خمّنوا صح`)
      ];
    }
    app.replaceChildren(
      el('div', { class: 'top' }, el('span', null, 'الجولة ' + state.round), el('span')),
      el('div', { class: 'card' }, ...body),
      el('p', { class: 'hint' }, 'الجولة الجاية بعد ', cd, ' ثانية… (النقاط مخفية لنهاية اللعبة)')
    );
    const upd = () => { cd.textContent = secsLeft(); };
    upd(); tick = setInterval(upd, 500);
  }

  function renderEnded() {
    const isHost = state.you.id === state.hostId;
    const medals = ['🥇', '🥈', '🥉'];
    app.replaceChildren(
      el('h1', null, '🏁 انتهت اللعبة'),
      el('div', { class: 'card' }, ...state.final.map((r) => el('div', { class: 'rank' + (r.rank === 1 ? ' first' : '') },
        el('span', null, (medals[r.rank - 1] || r.rank + '.') + ' ' + r.name), el('span', null, r.score)))),
      isHost ? el('button', { onclick: () => send({ type: 'start', winScore: state.winScore }) }, 'العب من جديد') : el('p', { class: 'hint' }, 'بانتظار المضيف…'),
      el('div', { class: 'gap' }),
      el('button', { class: 'alt', onclick: leave }, 'اطلع من الغرفة')
    );
  }

  // رابط الدعوة ?room=CODE
  const q = new URLSearchParams(location.search).get('room');
  if (q) { const s = store.get(); if (s.code !== q.toUpperCase()) { store.clear(); } history.replaceState(null, '', location.pathname); window.__invite = q.toUpperCase(); }
  const origHome = renderHome;
  renderHome = function () { origHome(); if (window.__invite) { const c = app.querySelectorAll('input')[1]; if (c) c.value = window.__invite; } };
  connect();
})();
</script>
</body>
</html>
